<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hill Climb</title>
<style>
  :root { --bg:#0f1115; --card:#181b22; --line:#262a33; --text:#e7e9ee; --dim:#8b93a3; --ok:#3ccf8e; --warn:#f2b54a; --bad:#f06363; --off:#3a3f4a; --accent:#6ea8fe; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.4 -apple-system, system-ui, "Segoe UI", sans-serif; }
  header { display:flex; align-items:center; gap:16px; padding:12px 16px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  h1 { font-size:16px; margin:0; font-weight:600; }
  .pill { padding:3px 10px; border-radius:999px; background:var(--card); border:1px solid var(--line); color:var(--dim); font-size:12px; }
  .timer { font:600 28px ui-monospace, Menlo, monospace; margin-left:auto; }
  main { display:grid; grid-template-columns: 2fr 1fr; gap:12px; padding:12px 16px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .cams { display:grid; grid-template-columns: 2fr 1fr; grid-template-rows: auto auto; gap:8px; }
  .cams figure { margin:0; background:#000; border-radius:8px; overflow:hidden; position:relative; }
  .cams figure:first-child { grid-row: span 2; }
  .cams img { width:100%; display:block; aspect-ratio:16/9; object-fit:cover; }
  .cams figcaption { position:absolute; left:8px; top:6px; font-size:11px; color:#fff; background:#0008; padding:1px 6px; border-radius:4px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px; margin-bottom:12px; }
  .card h2 { font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); margin:0 0 8px; font-weight:600; }
  .row { display:flex; justify-content:space-between; padding:3px 0; }
  .big { font:600 34px ui-monospace, Menlo, monospace; }
  .light { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:8px; background:var(--off); vertical-align:middle; }
  .yes { background:var(--ok); } .no { background:var(--off); } .unknown { background:var(--warn); } .bad { background:var(--bad); }
  .states { display:flex; flex-wrap:wrap; gap:6px; }
  .states span { padding:3px 8px; border-radius:6px; background:#0d0f13; color:var(--dim); font-size:12px; border:1px solid var(--line); }
  .states span.on { background:var(--accent); color:#071225; border-color:var(--accent); font-weight:600; }
  .banner { display:none; background:var(--ok); color:#06210f; font-weight:700; padding:10px 12px; border-radius:8px; margin-bottom:12px; }
  button { background:#232833; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:8px 14px; font-weight:600; cursor:pointer; }
  button.stop { background:var(--bad); border-color:var(--bad); color:#fff; }
  .muted { color:var(--dim); font-size:12px; }
  pre { white-space:pre-wrap; font-size:11px; color:var(--dim); margin:0; max-height:140px; overflow:auto; }
</style>
</head>
<body>
<header>
  <h1>Hill Climb</h1>
  <span class="pill" id="mode">mode</span>
  <span class="pill" id="backend">backend</span>
  <span class="pill" id="health">health</span>
  <div class="timer" id="timer">5:00</div>
</header>
<main>
  <section>
    <div class="cams">
      <figure><img id="c_overhead" alt="overhead"><figcaption>overhead</figcaption></figure>
      <figure><img id="c_left_wrist" alt="left wrist"><figcaption>left wrist</figcaption></figure>
      <figure><img id="c_right_wrist" alt="right wrist"><figcaption>right wrist</figcaption></figure>
    </div>
    <div class="card" style="margin-top:12px">
      <h2>Left arm</h2>
      <div class="states" id="states"></div>
      <div class="row" style="margin-top:8px"><span class="muted" id="reason"></span><span class="muted" id="insince"></span></div>
    </div>
    <div class="card"><h2>Last step</h2><pre id="last">none</pre></div>
  </section>
  <aside>
    <div class="banner" id="stopnow">Call stop now</div>
    <div class="card">
      <h2>Tower</h2>
      <div class="big"><span id="tower">0</span><span class="muted" style="font-size:14px"> blocks</span></div>
      <div class="row"><span>Height</span><span id="inches">0.0 in</span></div>
      <div class="row"><span>Active goal</span><span id="goal">-</span></div>
      <div class="row"><span>Stage 2 passed</span><span id="stage2">no</span></div>
    </div>
    <div class="card">
      <h2>USB gate</h2>
      <div id="gate"></div>
      <div class="row"><span>Unplugged</span><span id="unplugged">-</span></div>
    </div>
    <div class="card">
      <h2>Score estimate</h2>
      <div class="big" id="score">0</div>
      <div class="muted" id="scoreparts"></div>
    </div>
    <div class="card">
      <button class="stop" onclick="post('/left/stop')">Stop round</button>
      <button class="stop" onclick="post('/left/estop')">E-stop left</button>
      <span id="practice" style="display:none"><button onclick="post('/left/go')">Go</button></span>
    </div>
  </aside>
</main>
<script>
const STATES = ["IDLE","LOCKED","STACK","SETTLE_CHECK","REST","RECOVER","FREEZE","END","FAULT"];
document.getElementById("states").innerHTML = STATES.map(s => `<span id="s_${s}">${s}</span>`).join("");
const $ = id => document.getElementById(id);
function light(v){ const c = v===true||v==="yes" ? "yes" : v==="unknown"||v===undefined||v===null ? "unknown" : v==="error" ? "bad" : "no"; return `<span class="light ${c}"></span>`; }
async function post(p){ try { await fetch(p, {method:"POST", headers:{"Content-Type":"application/json"}, body:"{}"}); } catch(e){} }
async function tick(){
  try {
    const r = await fetch("/api/state", {cache:"no-store"}); const d = await r.json(); const L = d.left, G = d.gate || {};
    const tl = L.time_left_s; $("timer").textContent = tl==null ? "--:--" : `${Math.floor(tl/60)}:${String(Math.floor(tl%60)).padStart(2,"0")}`;
    $("mode").textContent = L.settings.mode + (L.settings.drive==="external" ? " / external" : ""); $("backend").textContent = L.backend;
    const bad = Object.entries(L.health||{}).filter(([k,v]) => k!=="heartbeat" && v && v!=="ok");
    $("health").textContent = bad.length ? "health: " + bad.map(([k])=>k).join(", ") : "health ok";
    STATES.forEach(s => $("s_"+s).classList.toggle("on", s===L.state));
    $("reason").textContent = L.reason || ""; $("insince").textContent = `${L.in_state_s}s`;
    $("tower").textContent = L.tower_blocks; $("inches").textContent = `${L.tower_in.toFixed(1)} in`; $("goal").textContent = L.active_goal;
    $("stage2").textContent = L.stage2_passed ? "yes" : "no";
    const c = G.checks || {};
    $("gate").innerHTML = `<div class="row"><span>${light(G.open?true:"no")}Gate ${G.open?"OPEN":"shut"}</span><span class="muted">${G.known===false?"unknown":""}</span></div>` +
      ["socket_emptied","jaw_released","fast_vlm","agentic_vlm","healthy"].map(k => `<div class="row"><span>${light(c[k])}${k.replace("_"," ")}</span><span class="muted">${c[k]??"-"}</span></div>`).join("");
    $("unplugged").textContent = G.known ? `${G.unplugged_count ?? 0} of 4` : "-";
    $("score").textContent = L.score.total; $("scoreparts").textContent = `USB ${L.score.usb} + tower ${L.score.tower} + bonus ${L.score.bonus}`;
    $("stopnow").style.display = L.call_stop_now ? "block" : "none"; $("stopnow").textContent = "Call stop now: " + (L.call_stop_why||"");
    $("practice").style.display = L.settings.mode==="practice" && (L.state==="IDLE"||L.state==="END") ? "inline" : "none";
    $("last").textContent = JSON.stringify(L.last_step || {}, null, 1);
  } catch(e) { $("health").textContent = "server unreachable"; }
}
function cams(){ const t = Date.now(); ["overhead","left_wrist","right_wrist"].forEach(n => { const i = $("c_"+n); const img = new Image(); img.onload = () => { i.src = img.src; }; img.src = `/cam/${n}.jpg?t=${t}`; }); }
setInterval(tick, 500); setInterval(cams, 500); tick(); cams();
</script>
</body>
</html>
